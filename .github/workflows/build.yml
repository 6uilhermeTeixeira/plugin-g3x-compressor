name: build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev
          libxinerama-dev libxrandr-dev libxrender-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DG3X_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    needs: linux
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DG3X_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test VST3 packaging
        shell: pwsh
        run: ./scripts/test-package-vst3.ps1
      - name: Package Windows VST3
        shell: pwsh
        run: ./scripts/package-vst3.ps1 -BundlePath "build/G3XCompressor_artefacts/Release/VST3/G3X Compressor.vst3" -Destination dist
      - name: Upload Windows VST3
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: G3X-Compressor-Windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "[Download Windows x64 VST3]($env:ARTIFACT_URL) — available for 30 days." >> $env:GITHUB_STEP_SUMMARY
          "Extract the ZIP, verify SHA256SUMS.txt, then copy the entire G3X Compressor.vst3 folder to your VST3 directory." >> $env:GITHUB_STEP_SUMMARY
